{% extends "base.html" %}
{% block title %}Forgot password | CampusConnect{% endblock %}

{% block content %}
<main class="auth">
  <h1>Forgot your password?</h1>
  <p class="lead">Enter your email and we will send you a link to set a new one.</p>

  <form method="POST" action="{{ url_for('forgot_password') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@college.edu" required>
    </div>
    <button type="submit" class="btn full">Send reset link</button>
  </form>

  <p class="alt"><a href="{{ url_for('login') }}">Back to login</a></p>
</main>
{% endblock %}
