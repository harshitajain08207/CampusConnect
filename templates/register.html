{% extends "base.html" %}
{% block title %}Register | CampusConnect{% endblock %}

{% block content %}
<main class="auth">
  <h1>Create your account</h1>
  <p class="lead">Join your campus on CampusConnect.</p>

  <form method="POST" action="/register">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" placeholder="Your full name" required>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@college.edu" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="At least 8 characters" minlength="8" required>
    </div>

    <div class="row">
      <div class="field">
        <label for="department">Department</label>
        <select id="department" name="department" required>
          <option value="">Select department</option>
          <option value="computer-science">Computer Science</option>
          <option value="information-technology">Information Technology</option>
          <option value="management">Management</option>
        </select>
      </div>
      <div class="field">
        <label for="semester">Semester</label>
        <select id="semester" name="semester" required>
          <option value="">Select semester</option>
          <option value="1">Semester 1</option>
          <option value="2">Semester 2</option>
          <option value="3">Semester 3</option>
          <option value="4">Semester 4</option>
          <option value="5">Semester 5</option>
          <option value="6">Semester 6</option>
        </select>
      </div>
    </div>

    <fieldset class="field">
      <legend>I am a</legend>
      <div class="roles">
        <label><input type="radio" name="role" value="student" checked> Student</label>
        <label><input type="radio" name="role" value="teacher"> Teacher</label>
      </div>
    </fieldset>

    <button type="submit" class="btn full">Create account</button>
  </form>

  <p class="alt">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</main>
{% endblock %}
