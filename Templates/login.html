{% extends "base.html" %}
{% block title %}Login | CampusConnect{% endblock %}

{% block content %}
<main class="auth">
  <h1>Welcome back</h1>
  <p class="lead">Log in to your CampusConnect account.</p>

  <form method="POST" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@college.edu" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter your password" required>
    </div>
    <button type="submit" class="btn full">Log in</button>
  </form>

  <p class="alt">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</main>
{% endblock %}
